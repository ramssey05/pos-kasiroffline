        const path = basePath ? basePath + '.' + String(prop) : String(prop);
        notify(path);
        return ok;
      }
    });
    proxyCache.set(obj, proxy);
    return proxy;
  }

  function queueRender() {
    if (renderQueued || rendering) return;
    renderQueued = true;
    queueMicrotask(() => { renderQueued = false; renderApp(); });
  }

  function evaluate(expr, scope, event) {
    if (!expr) return undefined;
    try {
      const fn = new Function('$event', 'with(this){ return (' + expr + ') }');
      return fn.call(scope, event);
    } catch (e) {
      try {
        const fn = new Function('$event', 'with(this){ ' + expr + ' }');
        return fn.call(scope, event);
      } catch (err) {
        console.warn('POS expression error:', expr, err);
        return undefined;
      }
    }
  }

  function assignModel(expr, scope, value) {
    try {
      const fn = new Function('value', 'with(this){ ' + expr + ' = value; }');
      fn.call(scope, value);
      queueRender();
    } catch (e) { console.warn('POS model error:', expr, e); }
  }

  function modelValue(el, scope) {
    let v = evaluate(el.getAttribute('x-model') || el.getAttribute('x-model.number'), scope);
    return v == null ? '' : v;
  }

  function setupModel(el, scope) {
    const expr = el.getAttribute('x-model') || el.getAttribute('x-model.number');
    if (!expr || el.__miniModelBound) return;
    el.__miniModelBound = true;
    const handler = () => {
      let value = el.type === 'checkbox' ? el.checked : el.value;
      if (el.hasAttribute('x-model.number')) value = value === '' ? 0 : Number(value);
      assignModel(expr, scope, value);
    };
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', handler);
  }

  function applyDirectives(el, scope) {
    if (el.nodeType !== 1) return;
    if (el.hasAttribute('x-text')) el.textContent = String(evaluate(el.getAttribute('x-text'), scope) ?? '');
    if (el.hasAttribute('x-show')) el.style.display = evaluate(el.getAttribute('x-show'), scope) ? '' : 'none';

    for (const attr of Array.from(el.attributes)) {
      if (attr.name.startsWith(':')) {
        const name = attr.name.slice(1);
        const val = evaluate(attr.value, scope);
        if (name === 'class') {
          const base = el.__miniBaseClass || el.getAttribute('class') || '';
          el.__miniBaseClass = base;
          let dynamicClass = '';
          if (val && typeof val === 'object') {
            dynamicClass = Object.entries(val)
              .filter(([, enabled]) => !!enabled)
              .map(([cls]) => cls)
              .join(' ');
          } else if (val) {
            dynamicClass = String(val);
          }
          el.setAttribute('class', base + (dynamicClass ? ' ' + dynamicClass : ''));
        } else if (name === 'disabled') el.disabled = !!val;
        else if (name === 'src') { if (val != null) el.setAttribute('src', val); }
        else if (name !== 'key') { if (val == null || val === false) el.removeAttribute(name); else el.setAttribute(name, String(val)); }
      }
    }

    const model = el.getAttribute('x-model') || el.getAttribute('x-model.number');
    if (model) {
      setupModel(el, scope);
      const v = modelValue(el, scope);
      if (el.type === 'checkbox') el.checked = !!v;
      else if (document.activeElement !== el) el.value = v;
    }

    for (const attr of Array.from(el.attributes)) {
      if (!attr.name.startsWith('@')) continue;
      const raw = attr.name.slice(1);
      if (el.__miniEvents && el.__miniEvents.has(raw)) continue;
      el.__miniEvents = el.__miniEvents || new Set();
      el.__miniEvents.add(raw);
      const [eventName, ...mods] = raw.split('.');
      const handler = ev => {
        if (mods.includes('self') && ev.target !== el) return;
        if (mods.includes('prevent')) ev.preventDefault();
        const result = evaluate(attr.value, scope, ev);
        if (result && typeof result.then === 'function') {
          result.then(() => queueRender()).catch(e => { console.warn(e); queueRender(); });
        }
        queueRender();
      };
      el.addEventListener(eventName, handler);
    }
    el.removeAttribute('x-cloak');
  }

  function renderChildren(parent, scope) {
    for (let node = parent.firstChild; node;) {
      if (node.nodeType === 1 && node.tagName === 'TEMPLATE') {

        if (tmpl.hasAttribute('x-for')) {
          renderFor(tmpl, scope);
          let after = tmpl.nextSibling;
          while (after && after.__miniOwner === tmpl) after = after.nextSibling;
          node = after;
          continue;
        }
        if (tmpl.hasAttribute('x-if')) {
          renderIf(tmpl, scope);
          let after = tmpl.nextSibling;
          while (after && after.__miniOwner === tmpl) after = after.nextSibling;
          node = after;
          continue;
        }
      } else if (node.nodeType === 1) {
        renderElement(node, scope);
      }
      node = node.nextSibling;
    }
  }

  function clearGenerated(tmpl) {
    let n = tmpl.nextSibling;
    while (n && n.__miniOwner === tmpl) { const next = n.nextSibling; n.remove(); n = next; }
  }

  function renderFor(tmpl, parentScope) {
    clearGenerated(tmpl);
    const expr = tmpl.getAttribute('x-for');
    const m = expr.match(/^\s*(?:\(([^,]+)\s*,\s*([^\)]+)\)|([^\s]+))\s+in\s+(.+)\s*$/);
    if (!m) return;
    const itemName = (m[1] || m[3]).trim(), indexName = (m[2] || '').trim(), list = evaluate(m[4], parentScope) || [];
    const arr = Array.isArray(list) ? list : Object.entries(list).map(([key,value]) => ({key,value}));
    let anchor = tmpl;
    arr.forEach((item, index) => {
      const scope = Object.create(parentScope);
      scope[itemName] = item;
      if (indexName) scope[indexName] = index;
      const frag = tmpl.content.cloneNode(true);
      const nodes = Array.from(frag.childNodes);
      nodes.forEach(n => { n.__miniGenerated = true; n.__miniOwner = tmpl; });
      anchor.after(frag);
      const inserted = [];
      let cur = anchor.nextSibling;
      for (let i=0;i<nodes.length && cur;i++,cur=cur.nextSibling) inserted.push(cur);
      inserted.forEach(n => { if (n.nodeType === 1) renderElement(n, scope); });
      anchor = inserted[inserted.length - 1] || anchor;
    });
  }

  function renderIf(tmpl, parentScope) {
    clearGenerated(tmpl);
    if (!evaluate(tmpl.getAttribute('x-if'), parentScope)) return;
    const frag = tmpl.content.cloneNode(true);
    const nodes = Array.from(frag.childNodes);
    nodes.forEach(n => { n.__miniGenerated = true; n.__miniOwner = tmpl; });
    tmpl.after(frag);
    nodes.forEach(n => { if (n.nodeType === 1) renderElement(n, parentScope); });
  }

  function renderElement(el, scope) {
    applyDirectives(el, scope);
    renderChildren(el, scope);
  }

  function renderApp() {
    if (!rootProxy || rendering) return;
    rendering = true;
    try { renderElement(document.querySelector('[x-data]'), rootProxy); } finally { rendering = false; }
  }

  function start() {
    const root = document.querySelector('[x-data]');
    if (!root) return;
    let data = evaluate(root.getAttribute('x-data'), window);
    if (!data || typeof data !== 'object') data = {};
    rootProxy = reactive(data, '');
    rootProxy.$nextTick = fn => queueMicrotask(() => setTimeout(() => fn && fn(), 0));
    rootProxy.$watch = (path, fn) => { if (!watchers.has(path)) watchers.set(path, new Set()); watchers.get(path).add(fn); return () => watchers.get(path)?.delete(fn); };
    rootProxy.$dispatch = () => {};
    window.__POS_APP__ = rootProxy;
    if (root.hasAttribute('x-init')) evaluate(root.getAttribute('x-init'), rootProxy);
    renderApp();
  }

  window.addEventListener('DOMContentLoaded', start, { once: true });
})();
